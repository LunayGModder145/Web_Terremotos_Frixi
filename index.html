<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web de Terremotos</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!--Codigo CSS de Leaflet-->
    <link rel="stylesheet"
     href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
     crossorigin=""/>

</head>
<body>
    <header>
       <h1>Monitoreo de Terremotos Globales</h1>
       <p>Vista de datos sismicos en tiempo real</p>
    </header>
    <main>
        <!--Primer Mapa-->
        <section class="map-card">
            <h2>Mapa General de Terremotos</h2>
            <div id="map-general" class="map-container"></div>
        </section>

        <!--Segundo Mapa-->
        <section class="map-card">
            <h2>2. Mapa Filtrado y Rango de Fechas</h2>
            <div id="map-filtered" class="map-container"></div>
        </section>
    </main>

    <!--Script de Leaflet-->
    <script
       src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
        crossorigin="">
    </script>
    <script src="js/script.js"></script>
</body>
</html>
